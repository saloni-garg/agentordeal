name: publish

on:
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: publish to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
